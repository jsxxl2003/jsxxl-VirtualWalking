
workflows:
  virtualwalking-ios:
    name: VirtualWalking iPhone
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Check Cast protocol parser
        script: |
          cd VirtualWalking-iPhone-Cast-0.3.0
          bash Scripts/test_probe.sh

      - name: Build web resources
        script: |
          cd VirtualWalking-iPhone-Cast-0.3.0
          python3 Scripts/build_web.py

      - name: Build iPhone app
        script: |
          cd VirtualWalking-iPhone-Cast-0.3.0
          set -o pipefail
          xcodebuild \
            -project VirtualWalkingTV.xcodeproj \
            -scheme VirtualWalkingTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log

      - name: Create IPA for Sideloadly
        script: |
          cd VirtualWalking-iPhone-Cast-0.3.0
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VirtualWalkingTV.app Payload/
          zip -qry VirtualWalking-iPhone.ipa Payload

    artifacts:
      - VirtualWalking-iPhone-Cast-0.3.0/VirtualWalking-iPhone.ipa
      - VirtualWalking-iPhone-Cast-0.3.0/xcodebuild.log

  virtualwalking-android-tv:
    name: VirtualWalking Android TV APK
    instance_type: linux
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build Android TV APK
        script: |
          cd VirtualWalking-TV-Receiver
          gradle --no-daemon assembleDebug
    artifacts:
      - VirtualWalking-TV-Receiver/app/build/outputs/apk/debug/*.apk
