
workflows:
  virtualwalking-ios:
    name: VirtualWalking iPhone
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Check Cast protocol parser
        script: |
          cd VirtualWalking-iPhone-Cast-0.3.0
          bash Scripts/test_probe.sh

      - name: Build web resources
        script: |
          cd VirtualWalking-iPhone-Cast-0.3.0
          python3 Scripts/build_web.py

      - name: Build iPhone app
        script: |
          cd VirtualWalking-iPhone-Cast-0.3.0
          xcodebuild \
            -project VirtualWalkingTV.xcodeproj \
            -scheme VirtualWalkingTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Create IPA for Sideloadly
        script: |
          cd VirtualWalking-iPhone-Cast-0.3.0
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VirtualWalkingTV.app Payload/
          zip -qry VirtualWalking-iPhone.ipa Payload

    artifacts:
      - VirtualWalking-iPhone-Cast-0.3.0/VirtualWalking-iPhone.ipa

