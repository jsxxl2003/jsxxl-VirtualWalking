name: VirtualWalking Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VirtualWalking-TV-Receiver/**'
      - '.github/workflows/virtualwalking-android-tv.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check training and TV player behavior
        run: node --test VirtualWalking-iPhone-Cast-0.3.0/Tests/*.test.cjs VirtualWalking-TV-Receiver/tests/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android TV APK
        run: |
          cd VirtualWalking-TV-Receiver
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualWalking-TV-Receiver-APK
          path: VirtualWalking-TV-Receiver/app/build/outputs/apk/debug/*.apk
